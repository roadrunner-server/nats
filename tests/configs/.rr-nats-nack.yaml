version: '3'

rpc:
  listen: tcp://127.0.0.1:6223

server:
  command: "php php_test_files/jobs/jobs_nack.php"
  relay: "pipes"
  relay_timeout: "20s"

nats:
  addr: "nats://127.0.0.1:4222"

jobs:
  num_pollers: 1
  pipeline_size: 100000
  pool:
    num_workers: 10
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 60s

logs:
  level: debug
  encoding: console
  mode: development
