services:
  nats:
    image: nats:2.12-alpine
    # -js enables jetstream, -m exposes the monitoring endpoint the healthcheck uses
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # fronts nats for the durability (redial) test; bridged rather than host
  # networked so the api and the proxied port are reachable off Linux too
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:19224:19224"
